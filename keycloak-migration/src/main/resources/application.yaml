spring:
  application:
    name: keycloak-migration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DATASOURCE_URL:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_NAME:keycloak_migration}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Liquibase (nutzt automatisch spring.datasource!)
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    drop-first: false

  # OAuth2 Client registration for Keycloak - only actually wired into the security filter
  # chain when keycloak.migration.oauth-client-enabled=true (see SecurityConfig)
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_RESOURCE-SERVER_CLIENT_ID:test-api}
            client-secret: ${KEYCLOAK_RESOURCE-SERVER_CLIENT-SECRET:}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            # Explicit endpoints instead of issuer-uri: issuer-uri triggers eager OIDC discovery
            # (a live HTTP call) at bean-creation time, which breaks contexts where Keycloak's
            # real URL is only known at runtime (e.g. a randomized Testcontainer port in tests).
            authorization-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:test}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:test}/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:test}/protocol/openid-connect/certs
            user-info-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:test}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

# Server
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Logging
logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    de.usermigration: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/keycloak-migration.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

# Legacy JWT Config (für LegacyJwtService / AuthenticationService)
jwt:
  secret: ${JWT_LEGACY_SECRET:your-default-secret-key-min-256-bit}
  issuer: ${JWT_LEGACY_ISSUER:test-token-issuer}
  refresh-issuer: ${JWT_LEGACY_REFRESH_ISSUER:test-refresh-token-issuer}
  expiry-seconds: 3600
  refresh-expiry-seconds: 1814400

legacy:
  jwt:
    issuer: ${JWT_LEGACY_ISSUER:test-token-issuer}
    refresh-issuer: ${JWT_LEGACY_REFRESH_ISSUER:test-refresh-token-issuer}
    access-token-expiry-seconds: 3600
    refresh-token-expiry-seconds: 2592000

# Legacy Auth Configuration (for migration filter)
auth:
  legacy:
    jwt-secret: ${JWT_LEGACY_SECRET:your-default-secret-key-min-256-bit}
    issuer: ${JWT_LEGACY_ISSUER:test-token-issuer}
    refresh-issuer: ${JWT_LEGACY_REFRESH_ISSUER:test-refresh-token-issuer}

# Keycloak Migration Configuration
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:test}

  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    grant-type: password

  resource-server:
    client-id: ${KEYCLOAK_RESOURCE-SERVER_CLIENT_ID:test-api}
    client-secret: ${KEYCLOAK_RESOURCE-SERVER_CLIENT-SECRET:}
    issuer-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:test}
    jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:test}/protocol/openid-connect/certs

  # Migration Configuration - the trigger switches
  migration:
    # Migrate users to Keycloak on login / on legacy token access
    migrate-users: ${KEYCLOAK_MIGRATE_USERS:true}
    send-password-email: ${KEYCLOAK_SEND_PASSWORD_EMAIL:false}
    dry-run: ${KEYCLOAK_MIGRATION_DRY_RUN:false}
    # Step 2: once migration is (almost) done, redirect requests with no valid token into
    # Keycloak's own login instead of returning the legacy JSON 401. /auth/login still works
    # as a fallback for callers that haven't switched over yet.
    oauth-client-enabled: ${KEYCLOAK_OAUTH_CLIENT_ENABLED:false}
