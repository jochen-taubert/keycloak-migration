databaseChangeLog:
  - changeSet:
      id: add-keycloak-migration-fields
      author: jochen.taubert (generated)
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                tableName: test_user
            - not:
                - columnExists:
                    columnName: keycloak_id
                    tableName: test_user
      changes:
        - addColumn:
            tableName: test_user
            columns:
              - column:
                  name: keycloak_id
                  type: varchar(255)
              - column:
                  name: migrated_at
                  type: timestamp
        - createIndex:
            tableName: test_user
            indexName: idx_user_keycloak_id
            columns:
              - column:
                  name: keycloak_id
